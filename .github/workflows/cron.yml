name: Cron — daily edition

# 6 AM EST = 11:00 UTC (winter). Slides to 7 AM EDT in summer — acceptable.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to run"
        required: true
        default: morning
        type: choice
        options: [morning, evening]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Linh News cron
        env:
          BASE_URL: https://linh-news.fly.dev
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLOT: ${{ github.event.inputs.slot || 'morning' }}
        run: |
          set -euo pipefail
          echo "Triggering /cron/$SLOT on $BASE_URL"
          status=$(curl -sS -o /tmp/cron.out -w "%{http_code}" \
            -X POST "$BASE_URL/cron/$SLOT" \
            -H "X-Cron-Token: $CRON_SECRET")
          echo "HTTP $status"
          cat /tmp/cron.out
          if [ "$status" != "202" ]; then exit 1; fi
