app = "linh-news"
primary_region = "ewr"

[build]

[env]
TZ = "America/New_York"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/healthz"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

[deploy]
release_command = "uv run alembic upgrade head"

[processes]
app = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

# No persistent volume needed — Postgres holds all state.

# No server-side cron. Generation runs on Linh's local Windows machine
# (Task Scheduler running scripts/trigger_cron.ps1, every 6 hours), writing
# results to Fly Postgres through `fly proxy 15432:5432`. The server is
# read-only with respect to generation.
