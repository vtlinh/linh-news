[project]
name = "linh-news"
version = "0.1.0"
description = "Personalized daily news HTML + Linh Times PDF"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "weasyprint>=63.0",
    "google-auth>=2.36",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.150",
    "httpx>=0.28",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "beautifulsoup4>=4.12",
    "pillow>=11.0",
    "mako>=1.3",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's canonical pattern is `x = Depends(...)` / `x = Form(...)` in
# defaults. The check is unhelpful for FastAPI handlers.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# weather_prose holds 360 hand-written phrases as string literals; wrapping
# them across multiple lines hurts readability without aiding review.
"app/weather_prose.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
